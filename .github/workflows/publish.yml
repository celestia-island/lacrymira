name: Publish

on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crates-io:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates in dependency order
        env:
          # Isolated CARGO_HOME: the runner's own cargo config replaces
          # crates-io with a mirror registry, and `cargo publish` refuses to
          # publish through a non-remote replacement source ("crates-io is
          # replaced with non-remote-registry source"). A clean home resolves
          # from the real sparse index; deps re-download cold (fine inside
          # the 30-minute budget).
          CARGO_HOME: ${{ runner.temp }}/publish-cargo-home
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          mkdir -p "$CARGO_HOME"
          for crate in lacrymira-macros lacrymira lacrymira-mock lacrymira-redb lacrymira-wasi lacrymira-pg; do
            echo "=== publishing $crate ==="
            log="$RUNNER_TEMP/publish-$crate.log"
            if cargo publish -p "$crate" >"$log" 2>&1; then
              echo "$crate published"
              sleep 20
            elif grep -qi "already exists" "$log"; then
              echo "::warning::$crate already at the target version (idempotent rerun)"
            else
              echo "::error::$crate publish failed"
              cat "$log"
              exit 1
            fi
          done
