name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasi:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - run: cargo build --target wasm32-wasip2 --release -p lacrymira-core -p lacrymira-redb -p lacrymira-wasi

  tokio-zero:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Verify zero tokio in WASI tree
        run: |
          count=$(cargo tree -p lacrymira-core -p lacrymira-redb -p lacrymira-wasi \
            --target wasm32-wasip2 --no-dev-dependencies 2>/dev/null | grep -c tokio || true)
          if [ "$count" -gt 0 ]; then
            echo "FAIL: $count tokio references found in WASI dependency tree"
            exit 1
          fi
          echo "PASS: zero tokio in WASI tree"
