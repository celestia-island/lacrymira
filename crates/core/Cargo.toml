[package]
name = "lacrymira"
description = "Typed multi-model data access layer — SQL and KV under one command surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "../../README.md"
keywords = ["database", "orm", "sql", "postgres", "wasm"]
categories = ["database"]

[dependencies]
serde = { workspace = true }
lacrymira-macros = { workspace = true }
serde_json = "^1"
chrono = { workspace = true, optional = true }
thiserror = { workspace = true }
jiff = { workspace = true, optional = true }
uuid = { version = "^1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
rmp-serde = { workspace = true }

[features]
default = ["jiff"]
chrono = ["dep:chrono"]
jiff = ["dep:jiff"]

[lints]
workspace = true
